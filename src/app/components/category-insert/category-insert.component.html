<table class="category-table">
    <thead>
    <tr>
        <th>Nome Categoria</th>
        <th>Descrizione</th>
        <th>Azione</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let category of categories">
        <td>{{ category.name }}</td>
        <td>{{ category.description }}</td>
        <td>
            <button (click)="deleteCategory(category._id)" class="delete-btn">
                Elimina
            </button>
        </td>
    </tr>
    </tbody>
</table>

<p *ngIf="categories.length === 0" class="category-empty">
    Nessuna categoria disponibile.
</p>
<div class="category-form">
    <h2>Nuova Categoria</h2>

    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
            <label for="name">Nome</label>
            <input id="name" type="text" formControlName="name" placeholder="Inserisci nome categoria">
            <div class="error" *ngIf="categoryForm.get('name')?.touched && categoryForm.get('name')?.invalid">
                Il nome è obbligatorio
            </div>
        </div>

        <div class="form-group">
            <label for="description">Descrizione</label>
            <input id="description" type="text" formControlName="description" placeholder="Inserisci descrizione (opzionale)">
        </div>

        <button type="submit" [disabled]="categoryForm.invalid">
            Salva
        </button>

    </form>
</div>
