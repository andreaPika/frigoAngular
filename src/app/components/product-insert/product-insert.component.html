<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="product-form">

    <!-- BARCODE -->
    <div class="form-group">
        <label>Barcode</label>

        <div class="barcode-row">
            <input
                    type="text"
                    formControlName="barcode"
                    class="form-control"
                    placeholder="Scansiona o inserisci barcode"
                    minlength="8"
                    maxlength="13"
                    autocomplete="off"
            />

            <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-toggle="modal"
                    data-bs-target="#barcodeModal">
                📷 Scansiona
            </button>
        </div>

        <small *ngIf="loadingBarcode" class="text-info">
            🔍 Ricerca prodotto...
        </small>

        <small *ngIf="barcodeFound === true" class="text-success">
            ✔ Prodotto trovato e compilato automaticamente
        </small>

        <small *ngIf="barcodeFound === false" class="text-warning">
            ⚠ Nessun prodotto trovato, inserisci manualmente
        </small>
    </div>

    <!-- NOME -->
    <div class="form-group">
        <label>Nome</label>
        <input id="name" formControlName="name" type="text" class="form-control" />
    </div>

    <!-- CATEGORIA -->
    <div class="form-group">
        <label>Categoria</label>
        <select formControlName="category" class="form-control">
            <option *ngFor="let c of categories" [value]="c._id">
                {{ c.name }}
            </option>
        </select>
    </div>

    <!-- QUANTITA -->
    <div class="form-group">
        <label>Quantità</label>
        <div class="input-group">
            <input type="number" formControlName="quantity" class="form-control" />
            <select formControlName="unit" class="form-control">
                <option *ngFor="let u of units" [value]="u">{{ u }}</option>
            </select>
        </div>
    </div>

    <!-- SCADENZA -->
    <div class="form-group">
        <label>Data Scadenza</label>
        <input type="date" formControlName="expiryDate" class="form-control" />
    </div>

    <!-- POSIZIONE -->
    <div class="form-group">
        <label>Posizione</label>
        <select formControlName="fridgePosition" class="form-control">
            <option *ngFor="let p of fridgePositions" [value]="p._id">
                {{ p.name }} {{ p.description }}
            </option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid">
        Salva
    </button>
</form>

<!-- LISTA -->
<table class="product-table" *ngIf="products.length > 0">
    <thead>
    <tr>
        <th>Nome</th>
        <th>Azioni</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let product of products">
        <td>{{ product.name }}</td>
        <td>
            <button (click)="deleteProduct(product._id)">Elimina</button>
        </td>
    </tr>
    </tbody>
</table>

<p *ngIf="products.length === 0">
    Nessun prodotto disponibile.
</p>

<!-- MODAL SCANNER -->
<div class="modal fade" id="barcodeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Scanner Barcode</h5>
                <button id="closeModalBtn" type="button" class="btn-close" data-bs-dismiss="modal" (click)="stopScanner()"></button>
            </div>

            <div class="modal-body text-center">

                <video
                        id="video-preview"
                        style="width: 100%; border-radius: 8px;"
                ></video>

                <p *ngIf="!scanning">Premi "Avvia" per iniziare</p>
                <p *ngIf="scanning" class="text-success">🔍 Scanner attivo...</p>

            </div>

            <div class="modal-footer">

                <button class="btn btn-success" (click)="startScanner()" *ngIf="!scanning">
                    ▶ Avvia
                </button>

                <button class="btn btn-danger" (click)="stopScanner()" *ngIf="scanning">
                    ⏹ Stop
                </button>

                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" (click)="stopScanner()">
                    Chiudi
                </button>

            </div>

        </div>
    </div>
</div>
